[project]
name = "student-depression-mlops"
version = "0.2.0"
description = "Predicción de riesgo de depresión en estudiantes — proyecto de especialización en Ciencia de Datos e IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "jupyter",
    "ipykernel",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "prefect>=3.8.6",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "streamlit>=1.64.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
